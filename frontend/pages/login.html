<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Library — Login</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="login-bg">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">📚</div>
      <h1>College Library</h1>
      <p>Library Management System</p>
    </div>

    <div class="login-tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Student Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
      <button class="tab-btn" onclick="switchTab('admin')">Admin</button>
    </div>

    <!-- Student Login -->
    <div id="tab-login">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="login-email" class="form-control" placeholder="student@college.edu">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" class="form-control" placeholder="Your password">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">Login →</button>
    </div>

    <!-- Register -->
    <div id="tab-register" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label>Student ID *</label>
          <input type="text" id="reg-sid" class="form-control" placeholder="e.g. CS2024001">
        </div>
      </div>
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="reg-email" class="form-control" placeholder="student@college.edu">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Department</label>
          <select id="reg-dept" class="form-control">
            <option value="">Select Dept</option>
            <option>CSE</option><option>ECE</option><option>EEE</option>
            <option>MECH</option><option>CIVIL</option><option>IT</option>
          </select>
        </div>
        <div class="form-group">
          <label>Year</label>
          <select id="reg-year" class="form-control">
            <option value="">Year</option>
            <option>1</option><option>2</option><option>3</option><option>4</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" id="reg-phone" class="form-control" placeholder="Mobile number">
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" id="reg-password" class="form-control" placeholder="Create password">
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doRegister()">Register →</button>
    </div>

    <!-- Admin Login -->
    <div id="tab-admin" style="display:none">
      <div style="background:#fff8e1;border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:.85rem;color:#92400e;">
        🔐 Admin access only — library staff
      </div>
      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" id="admin-email" class="form-control" placeholder="admin@library.edu">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="admin-password" class="form-control" placeholder="Admin password">
      </div>
      <button class="btn btn-accent" style="width:100%;justify-content:center" onclick="doAdminLogin()">Admin Login →</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  function switchTab(tab) {
    ['login','register','admin'].forEach(t => {
      document.getElementById('tab-'+t).style.display = t === tab ? 'block' : 'none';
      document.querySelectorAll('.tab-btn')[['login','register','admin'].indexOf(t)].classList.toggle('active', t === tab);
    });
  }

  async function doLogin() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    if (!email || !password) return showToast('Please fill all fields', 'error');
    try {
      const data = await apiCall('/auth/login', 'POST', { email, password }, false);
      setAuth(data.token, data.user);
      showToast('Welcome, ' + data.user.name + '!');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    } catch (e) { showToast(e.message, 'error'); }
  }

  async function doRegister() {
    const body = {
      name: document.getElementById('reg-name').value,
      student_id: document.getElementById('reg-sid').value,
      email: document.getElementById('reg-email').value,
      phone: document.getElementById('reg-phone').value,
      department: document.getElementById('reg-dept').value,
      year: document.getElementById('reg-year').value,
      password: document.getElementById('reg-password').value
    };
    if (!body.name || !body.student_id || !body.email || !body.password)
      return showToast('Please fill all required fields', 'error');
    try {
      await apiCall('/auth/register', 'POST', body, false);
      showToast('Registered! Please login.', 'success');
      switchTab('login');
    } catch (e) { showToast(e.message, 'error'); }
  }

  async function doAdminLogin() {
    const email = document.getElementById('admin-email').value;
    const password = document.getElementById('admin-password').value;
    if (!email || !password) return showToast('Please fill all fields', 'error');
    try {
      const data = await apiCall('/auth/admin/login', 'POST', { email, password }, false);
      setAuth(data.token, data.user);
      showToast('Admin access granted!');
      setTimeout(() => window.location.href = 'admin.html', 1000);
    } catch (e) { showToast(e.message, 'error'); }
  }

  // If already logged in, redirect
  if (getToken()) {
    window.location.href = isAdmin() ? 'admin.html' : 'dashboard.html';
  }
</script>
</body>
</html>
