<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borrow / Return — Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-brand"><span class="logo-icon">📚</span><h1>College <span>Library</span> — Admin</h1></div>
  <div class="nav-links">
    <a href="admin.html">Dashboard</a>
    <a href="admin-books.html">Manage Books</a>
    <a href="admin-borrows.html" class="active">Borrow/Return</a>
    <a href="admin-students.html">Students</a>
  </div>
  <div class="nav-user"><span class="user-name">🛡️ Admin</span><button class="btn-logout" onclick="logout()">Logout</button></div>
</nav>

<div class="page">
  <div class="page-header"><h2>🔄 Borrow / Return Management</h2><p>Issue books to students and process returns</p></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem">
    <!-- Issue Book Card -->
    <div class="card">
      <div class="card-title">📤 Issue a Book</div>
      <div class="form-group">
        <label>Select Student</label>
        <input
  list="students-list"
  id="issue-student"
  class="form-control"
  placeholder="Type student name"
/>

<datalist id="students-list"></datalist>
      <div class="form-group">
        <label>Select Book</label>
       <input
  list="books-list"
  id="issue-book"
  class="form-control"
  placeholder="Type book name"
/>

<datalist id="books-list"></datalist>
      <button class="btn btn-accent" onclick="issueBook()" style="width:100%;justify-content:center">📤 Issue Book</button>
    </div>

    <!-- Return Book Card -->
    <div class="card">
      <div class="card-title">📥 Return a Book</div>
      <div class="form-group">
        <label>Search Active Borrow by Student Name / Roll No</label>
        <input type="text" id="return-search" class="form-control" placeholder="Student name or roll no…">
      </div>
      <button class="btn btn-primary" onclick="searchBorrows()" style="width:100%;justify-content:center">🔍 Find Records</button>
    </div>
  </div>

  <!-- All borrow records table -->
  <div class="card">
    <div class="card-title">📋 All Borrow Records</div>
    <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap">
      <button class="btn btn-outline btn-sm" onclick="filterStatus('all')">All</button>
      <button class="btn btn-primary btn-sm" onclick="filterStatus('borrowed')">Active</button>
      <button class="btn btn-danger btn-sm" onclick="filterStatus('overdue')">Overdue</button>
      <button class="btn btn-success btn-sm" onclick="filterStatus('returned')">Returned</button>
    </div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr><th>#</th><th>Student</th><th>Roll No</th><th>Book</th><th>Borrow Date</th><th>Due Date</th><th>Return Date</th><th>Status</th><th>Fine (₹)</th><th>Action</th></tr>
        </thead>
        <tbody id="borrows-table"><tr><td colspan="10" class="loading">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>

<script>

if (!requireAuth(true)) {}

let allBorrows = [];


// ===============================
// LOAD ALL DATA
// ===============================
async function loadData() {

  try {

    // LOAD STUDENTS
    const students = await apiCall('/students');

    // LOAD BOOKS
    const books = await apiCall('/books');

    // LOAD BORROWS
    const borrows = await apiCall('/borrows');

    allBorrows = borrows;


    // ===============================
    // STUDENT DROPDOWN
    // ===============================
    const studentSelect =
      document.getElementById('issue-student');

    const studentsList =
document.getElementById('students-list');

studentsList.innerHTML = '';

students.forEach(student => {

  studentsList.innerHTML += `
    <option 
      value="${student.id}"
      label="${student.name} (${student.student_id})">
    </option>
  `;
});


    // ===============================
    // BOOK DROPDOWN
    // ===============================
    const bookSelect =
      document.getElementById('issue-book');

const booksList =
document.getElementById('books-list');

booksList.innerHTML = '';

books.forEach(book => {

  booksList.innerHTML += `
    <option 
      value="${book.id}"
      label="${book.title} (${book.available_copies} available)">
    </option>
  `;
});

    // ===============================
    // RENDER BORROWS TABLE
    // ===============================
    renderBorrows(allBorrows);

  } catch (err) {

    console.log(err);

    showToast('Failed to load data', 'error');
  }
}


// ===============================
// FILTER BORROWS
// ===============================
function filterStatus(status) {

  const filtered =
    status === 'all'
    ? allBorrows
    : allBorrows.filter(r => r.status === status);

  renderBorrows(filtered);
}


// ===============================
// SEARCH BORROWS
// ===============================
function searchBorrows() {

  const q =
    document.getElementById('return-search')
    .value
    .toLowerCase();

  const filtered = allBorrows.filter(r =>

    (r.student_name || '')
    .toLowerCase()
    .includes(q)

  );

  renderBorrows(filtered);
}


// ===============================
// RENDER TABLE
// ===============================
function renderBorrows(records) {

  const tbody =
    document.getElementById('borrows-table');

  if (!records || records.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="10">
          No borrow records found
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = records.map((r, i) => `

    <tr>

      <td>${i + 1}</td>

      <td>${r.student_name || '-'}</td>

      <td>${r.student_id || '-'}</td>

      <td>${r.title || '-'}</td>

      <td>${r.borrow_date || '-'}</td>

      <td>${r.due_date || '-'}</td>

      <td>${r.return_date || '-'}</td>

      <td>${r.status || 'borrowed'}</td>

      <td>₹${r.fine || 0}</td>

      <td>

        ${r.status !== 'returned'
          ? `<button
                class="btn btn-success btn-sm"
                onclick="returnBook(${r.id})">
                Return
             </button>`
          : 'Returned'}

      </td>

    </tr>

  `).join('');
}


// ===============================
// ISSUE BOOK
// ===============================
async function issueBook() {

  const student_id =
    document.getElementById('issue-student').value;

  const book_id =
    document.getElementById('issue-book').value;

  if (!student_id || !book_id) {

    return showToast(
      'Please select student and book',
      'error'
    );
  }

  try {

    await apiCall(
      '/borrows/issue',
      'POST',
      {
        student_id,
        book_id
      }
    );

    showToast(
      'Book issued successfully',
      'success'
    );

    loadData();

  } catch (err) {

    console.log(err);

    showToast(err.message, 'error');
  }
}


// ===============================
// RETURN BOOK
// ===============================
async function returnBook(id) {

  try {

    await apiCall(
      `/borrows/return/${id}`,
      'POST'
    );

    showToast(
      'Book returned successfully',
      'success'
    );

    loadData();

  } catch (err) {

    console.log(err);

    showToast(err.message, 'error');
  }
}


// ===============================
// LOGOUT
// ===============================
function logout() {

  clearAuth();

  window.location.href = 'login.html';
}


// LOAD PAGE
loadData();

</script>
</body>
</html>
